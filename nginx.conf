server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # the header inlines ~30KB of mega-menu icon SVG into every page
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;
  # robots.txt / sitemap.xml must never fall through to the SPA handler —
  # before these files existed, /robots.txt answered 200 with the homepage HTML
  location = /robots.txt  { try_files $uri =404; access_log off; }
  location = /sitemap.xml { try_files $uri =404; types { } default_type application/xml; }
  # HTML carried no Cache-Control at all, so browsers applied heuristic
  # freshness (a fraction of the time since Last-Modified) and kept serving a
  # stale page without ever revalidating — a deploy could stay invisible for
  # hours. The pages are tiny and the assets they pull are content-hashed, so
  # always revalidate the HTML and let the ETag make it a 304.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    expires 7d; add_header Cache-Control "public";
  }
}
